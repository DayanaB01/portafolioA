    <section class="section" id="proyectos">
      <div class="section-head">
        <span class="num">01</span>
        <h2>Proyectos</h2>
      </div>

      <div class="project-card" *ngFor="let project of projects" [class.open]="isOpen(project.hash)">
        <div class="project-head" (click)="toggleProject(project.hash)">
          <div class="project-head-left">
            <span class="commit-hash">{{project.hash}}</span>
            <div>
              <div class="project-title">{{project.title}}</div>
              <div class="project-tagline">{{project.tagline}}</div>
            </div>
          </div>
          <span class="chevron">▸</span>
        </div>
        <div class="project-body">
          <div class="project-body-inner">
            <p class="project-desc">{{project.description}}</p>
            <div class="diff-block">
              <div class="diff-line" *ngFor="let detail of project.details">
                <span class="diff-plus">+</span>
                <span class="diff-label">{{detail.label}}</span>
                <span class="diff-val">{{detail.value}}</span>
              </div>
            </div>
            <div class="tech-tags" *ngFor="let tech of project.tech">
                <span>{{tech}}</span>
            </div>
            <div class="project-links">
          <a *ngIf="project.repoUrl" [href]="project.repoUrl" target="_blank" rel="noopener">Ver repositorio →</a>
          <a *ngIf="project.demoUrl" [href]="project.demoUrl" target="_blank" rel="noopener">Ver demo →</a>
            </div>
          </div>
        </div>
      </div>
    </section>
