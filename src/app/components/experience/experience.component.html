    <section class="section" id="experiencia">
      <div class="section-head">
        <span class="num">02</span>
        <h2>Experiencia</h2>
      </div>
      <div class="log">
        <div class="log-entry" *ngFor="let entry of entries">
          <div class="log-meta">{{entry.period}}</div>
          <div class="log-title">{{entry.title}}</div>
          <div class="log-desc">{{entry.description}}</div>
        </div>
      </div>
    </section>
